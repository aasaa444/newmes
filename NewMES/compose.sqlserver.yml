services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${NEWMES_SA_PASSWORD:?Set NEWMES_SA_PASSWORD}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - newmes-sqlserver-data:/var/opt/mssql

volumes:
  newmes-sqlserver-data:
