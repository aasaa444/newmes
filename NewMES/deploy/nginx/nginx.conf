user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    map $http_x_correlation_id $correlation_id {
        ~^[A-Za-z0-9._-]{1,64}$ $http_x_correlation_id;
        default $request_id;
    }

    log_format structured escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"correlation_id":"$correlation_id"}';
    access_log /dev/stdout structured;

    upstream newmes_api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 10m;

        location / {
            proxy_pass http://newmes_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_hide_header Server;
        }
    }
}
